# Netlify configuration for the Neo Tokyo Kochi build-tracker website.
# The site is the static contents of dashboard/ (no build step). This file is
# the source of truth for continuous deployment — it overrides the dashboard UI
# fields, so the publish directory is always dashboard/ on every git push.
[build]
  publish = "dashboard"
  command = ""

# Security headers for the public site. All dashboard scripts are external files
# (no inline scripts), so script-src omits 'unsafe-inline'. connect-src allows the
# Supabase project (REST + realtime) and the jsDelivr CDN that serves supabase-js;
# add any new external origin here. frame-ancestors 'none' blocks click-jacking.
# If a page breaks after deploy, check the browser console for the blocked origin
# and add it here (headers apply on the next deploy; easy to iterate).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://ggsxkhenzdhaachubrsc.supabase.co wss://ggsxkhenzdhaachubrsc.supabase.co https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# The customer tracker is the site root (dashboard/index.html); the staff
# portal moved to /staff/ (Nov 2026). Old ?view= staff links are forwarded to
# /staff/ by dashboard/tracker/tracker.js.

# Tracking links in WhatsApp/SMS: /t/NT-XXXXXXXX opens the tracker with the
# code filled in (the page reads it from the path).
[[redirects]]
  from = "/t/*"
  to = "/index.html"
  status = 200

# shared/ppi-sync.js fetches assets/benchmarks/… by a relative path, which from
# /staff/ means /staff/assets/…: serve the real files.
[[redirects]]
  from = "/staff/assets/*"
  to = "/assets/:splat"
  status = 200

# The service worker is re-checked on every visit so a release replaces it.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
